version: "3.8"

services:
  mysql:
    image: mysql:8.3.0
    container_name: aps-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: aps
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower_case_table_names=1
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
